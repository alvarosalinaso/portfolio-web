<div id="observable-worldcup-bracket" style="width:100%;min-height:400px;background:#0d1117;border-radius:8px;padding:1rem;">
  <p style="color:#8b949e;text-align:center;">Cargando visualización...</p>
</div>
<script type="module">
import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const resp = await fetch("https://alvarosalinaso.github.io/portfolio-web/data/observable_bracket.csv");
const data = await resp.json();

const container = document.getElementById("observable-worldcup-bracket");
container.innerHTML = "";

const chart = Plot.plot({
  style: { background: "#0d1117", color: "#e6edf3", fontFamily: "Inter, sans-serif" },
  width: Math.min(container.clientWidth, 960),
  height: 450,
  x: { grid: true, label: "X" },
  y: { grid: true, label: "Y" },
  marks: [
    Plot.barY(Array.isArray(data) ? data : data.games || data.seasons || [], {
      x: "x",
      y: "y",
      fill: "#58a6ff"
    }),
    Plot.ruleY([0])
  ]
});

container.appendChild(chart);
</script>
